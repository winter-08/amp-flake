name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Flake
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build

      - name: Build and smoke-test Amp
        run: |
          nix build .#packages.x86_64-linux.default
          timeout 10 ./result/bin/amp --version

      - name: Build desktop and module checks
        run: |
          nix build .#checks.x86_64-linux.desktop .#checks.x86_64-linux.home-manager .#checks.x86_64-linux.repository --no-link
          nix build .#amp-desktop --out-link result-desktop
          test -x result-desktop/bin/amp-desktop
          test -f result-desktop/share/applications/amp-desktop.desktop
          grep -F 'x-scheme-handler/com.ampcode.amp.linux.auth' result-desktop/share/applications/amp-desktop.desktop
          # Exercise the patched Electron runtime without a display or user data.
          ELECTRON_RUN_AS_NODE=1 result-desktop/bin/amp-desktop --version
