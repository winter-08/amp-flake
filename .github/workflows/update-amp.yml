name: Update Amp

on:
  schedule:
    # Amp publishes frequently; six-hour polling keeps this flake fresh without
    # wasting runner time. The updater downloads only tiny metadata files.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-amp
  cancel-in-progress: false

jobs:
  update:
    name: Update and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a new Amp release
        id: update
        run: |
          ./scripts/update.sh
          if git diff --quiet -- versions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate update
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check --all-systems --no-build
          nix build .#packages.x86_64-linux.default
          timeout 10 ./result/bin/amp --version

      - name: Commit update
        if: steps.update.outputs.changed == 'true'
        run: |
          version="$(jq --raw-output '.version' versions.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "Update Amp to $version"
          git push
